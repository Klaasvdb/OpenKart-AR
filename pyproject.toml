[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openkart"
version = "0.1.0"
description = "Open-source mixed-reality kart racing with real FPV Wi-Fi RC cars"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.8",
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openkart = "openkart.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
